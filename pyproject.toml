[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlb-kaizen"
version = "0.1.0"
description = "Reproducible MLB quantitative analytics foundation"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "KAIZEN"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
mlb-kaizen = "mlb_kaizen.interface.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["mlb_kaizen*"]

[tool.ruff]
line-length = 100
target-version = "py311"
